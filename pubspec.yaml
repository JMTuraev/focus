name: fokus
description: Local-first desktop client with collections, tasks, notes and calendar.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.3
  path_provider: ^2.1.4
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  url_launcher: ^6.3.2
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3: ^3.5.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  desktop_drop: ^0.8.4
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
