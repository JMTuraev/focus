name: TDLib (Windows x64)

# Actions → "TDLib (Windows x64)" → Run workflow.
# Result: artifact "tdlib-windows-x64" with tdjson.dll + OpenSSL/zlib DLLs.
on:
  workflow_dispatch:
    inputs:
      td_ref:
        description: "tdlib/td branch, tag or commit"
        default: "master"
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: ${{ inputs.td_ref }}
          path: td

      - name: Install dependencies (vcpkg)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg\vcpkg.exe install gperf:x64-windows openssl:x64-windows zlib:x64-windows

      - name: Build
        shell: pwsh
        run: |
          cd td
          mkdir build
          cd build
          cmake -A x64 -DCMAKE_INSTALL_PREFIX:PATH=../tdlib -DCMAKE_TOOLCHAIN_FILE:FILEPATH=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake ..
          cmake --build . --target install --config Release --parallel

      - name: Collect DLLs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item td\tdlib\bin\tdjson.dll dist\
          Copy-Item vcpkg\installed\x64-windows\bin\libcrypto-3-x64.dll dist\
          Copy-Item vcpkg\installed\x64-windows\bin\libssl-3-x64.dll dist\
          Copy-Item vcpkg\installed\x64-windows\bin\zlib1.dll dist\
          git -C td rev-parse HEAD | Out-File dist\TDLIB_COMMIT.txt
          Get-ChildItem dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-windows-x64
          path: dist/
